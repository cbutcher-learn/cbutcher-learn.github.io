<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="830" viewBox="0 0 1300 830" font-family="Arial, Helvetica, sans-serif">
  <rect width="1300" height="830" fill="#ffffff"/>

  <!-- Title -->
  <text x="650" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2d3d">Roadmap: A Learning Cycle, Not a Fixed Plan</text>
  <text x="650" y="70" text-anchor="middle" font-size="15" fill="#5a6472">Each phase advances only when evidence from the last one justifies it — sequenced to the school calendar</text>

  <!-- Calendar bar -->
  <rect x="40" y="98" width="1220" height="28" rx="4" fill="#eef1f4"/>
  <text x="150" y="117" text-anchor="middle" font-size="12.5" fill="#5a6472" font-weight="bold">SPRING / SUMMER</text>
  <text x="650" y="117" text-anchor="middle" font-size="12.5" fill="#5a6472" font-weight="bold">FALL → SPRING</text>
  <text x="1130" y="117" text-anchor="middle" font-size="12.5" fill="#5a6472" font-weight="bold">SPRING ONWARD</text>
  <line x1="360" y1="98" x2="360" y2="126" stroke="#d8dee4" stroke-width="1.5"/>
  <line x1="940" y1="98" x2="940" y2="126" stroke="#d8dee4" stroke-width="1.5"/>

  <!-- ===================== PHASE 1 ===================== -->
  <g>
    <rect x="40" y="150" width="360" height="46" rx="6" fill="#1f3a5f"/>
    <text x="220" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">PHASE 1 · MEASUREMENT FOUNDATION</text>

    <rect x="40" y="206" width="360" height="470" rx="6" fill="#f4f6f8" stroke="#d8dee4"/>

    <text x="58" y="234" font-size="13.5" font-weight="bold" fill="#1f2d3d">Goal</text>
    <text x="58" y="254" font-size="12.5" fill="#3d4753">Define target behaviors; establish</text>
    <text x="58" y="270" font-size="12.5" fill="#3d4753">structured data collection on</text>
    <text x="58" y="286" font-size="12.5" fill="#3d4753">existing touchpoints.</text>

    <text x="58" y="318" font-size="13.5" font-weight="bold" fill="#1f2d3d">Key Moves</text>
    <text x="58" y="338" font-size="12" fill="#3d4753">• Implementation Framework Working</text>
    <text x="58" y="353" font-size="12" fill="#3d4753">  Group defines target behaviors</text>
    <text x="58" y="371" font-size="12" fill="#3d4753">• Structured facilitator session notes</text>
    <text x="58" y="386" font-size="12" fill="#3d4753">  replace open-ended reflection</text>
    <text x="58" y="404" font-size="12" fill="#3d4753">• Automated post-session intent</text>
    <text x="58" y="419" font-size="12" fill="#3d4753">  surveys (leading indicator)</text>
    <text x="58" y="437" font-size="12" fill="#3d4753">• Pre-session progress surveys</text>
    <text x="58" y="452" font-size="12" fill="#3d4753">  (lagging indicator)</text>
    <text x="58" y="470" font-size="12" fill="#3d4753">• Re-examine product usage as an</text>
    <text x="58" y="485" font-size="12" fill="#3d4753">  intent-to-change proxy</text>

    <text x="58" y="517" font-size="13.5" font-weight="bold" fill="#1f2d3d">Small Experiments</text>
    <text x="58" y="537" font-size="12" fill="#3d4753">• Survey framing variance</text>
    <text x="58" y="552" font-size="12" fill="#3d4753">• Pilot check-ins (automated + calls)</text>
    <text x="58" y="567" font-size="12" fill="#3d4753">• Low-stakes facilitator observations</text>

    <rect x="58" y="592" width="324" height="70" rx="5" fill="#eef4ee" stroke="#5a8a5f"/>
    <text x="70" y="611" font-size="12.5" font-weight="bold" fill="#2f5c34">Evidenced by:</text>
    <text x="70" y="628" font-size="11.5" fill="#2f5c34">Published framework, consistent structured</text>
    <text x="70" y="643" font-size="11.5" fill="#2f5c34">capture, first review flags which signals</text>
    <text x="70" y="656" font-size="11.5" fill="#2f5c34">are worth building on</text>
  </g>

  <!-- Gate 1→2 -->
  <g>
    <polygon points="400,400 440,380 480,400 440,420" fill="#ffffff" stroke="#b28a2f" stroke-width="2"/>
    <text x="440" y="404" text-anchor="middle" font-size="16" fill="#b28a2f" font-weight="bold">→</text>
  </g>
  <text x="440" y="450" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">GATE</text>
  <text x="440" y="465" text-anchor="middle" font-size="10.5" fill="#8a6d1f">Structured data</text>
  <text x="440" y="478" text-anchor="middle" font-size="10.5" fill="#8a6d1f">must exist to</text>
  <text x="440" y="491" text-anchor="middle" font-size="10.5" fill="#8a6d1f">feed a model</text>

  <!-- ===================== PHASE 2 ===================== -->
  <g>
    <rect x="480" y="150" width="360" height="46" rx="6" fill="#1f3a5f"/>
    <text x="660" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">PHASE 2 · MODEL &amp; ADAPTATION</text>

    <rect x="480" y="206" width="360" height="470" rx="6" fill="#f4f6f8" stroke="#d8dee4"/>

    <text x="498" y="234" font-size="13.5" font-weight="bold" fill="#1f2d3d">Goal</text>
    <text x="498" y="254" font-size="12.5" fill="#3d4753">Synthesize data into an implementation-</text>
    <text x="498" y="270" font-size="12.5" fill="#3d4753">health view; let facilitators adapt</text>
    <text x="498" y="286" font-size="12.5" fill="#3d4753">sessions based on evidence.</text>

    <text x="498" y="318" font-size="13.5" font-weight="bold" fill="#1f2d3d">Key Moves</text>
    <text x="498" y="338" font-size="12" fill="#3d4753">• Build Implementation Health Model</text>
    <text x="498" y="353" font-size="12" fill="#3d4753">  from Phase 1 data streams</text>
    <text x="498" y="371" font-size="12" fill="#3d4753">• Test model validity: do facilitators</text>
    <text x="498" y="386" font-size="12" fill="#3d4753">  and ISTs agree with its read?</text>
    <text x="498" y="404" font-size="12" fill="#3d4753">• Develop facilitator menu — emphasis</text>
    <text x="498" y="419" font-size="12" fill="#3d4753">  and questioning within sessions</text>
    <text x="498" y="437" font-size="12" fill="#3d4753">• Facilitators use model to prep for</text>
    <text x="498" y="452" font-size="12" fill="#3d4753">  sessions before arriving on site</text>

    <text x="498" y="484" font-size="13.5" font-weight="bold" fill="#1f2d3d">Continuing Experiments</text>
    <text x="498" y="504" font-size="12" fill="#3d4753">• Phase 1 pilots expanded, refined, or</text>
    <text x="498" y="519" font-size="12" fill="#3d4753">  canceled based on captured value</text>
    <text x="498" y="537" font-size="12" fill="#3d4753">• New experiments added as gaps in</text>
    <text x="498" y="552" font-size="12" fill="#3d4753">  measurement or impact surface</text>

    <rect x="498" y="592" width="324" height="70" rx="5" fill="#eef4ee" stroke="#5a8a5f"/>
    <text x="510" y="611" font-size="12.5" font-weight="bold" fill="#2f5c34">Evidenced by:</text>
    <text x="510" y="628" font-size="11.5" fill="#2f5c34">Active model use in pilot accounts,</text>
    <text x="510" y="643" font-size="11.5" fill="#2f5c34">facilitator-reported value, and variation</text>
    <text x="510" y="656" font-size="11.5" fill="#2f5c34">in how facilitators adapt and teachers respond</text>
  </g>

  <!-- Gate 2→3 -->
  <g>
    <polygon points="840,400 880,380 920,400 880,420" fill="#ffffff" stroke="#b28a2f" stroke-width="2"/>
    <text x="880" y="404" text-anchor="middle" font-size="16" fill="#b28a2f" font-weight="bold">→</text>
  </g>
  <text x="880" y="450" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">GATE</text>
  <text x="880" y="465" text-anchor="middle" font-size="10.5" fill="#8a6d1f">Evidence the</text>
  <text x="880" y="478" text-anchor="middle" font-size="10.5" fill="#8a6d1f">model moves</text>
  <text x="880" y="491" text-anchor="middle" font-size="10.5" fill="#8a6d1f">real signals</text>

  <!-- ===================== PHASE 3 ===================== -->
  <g>
    <rect x="920" y="150" width="340" height="46" rx="6" fill="#1f3a5f"/>
    <text x="1090" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">PHASE 3 · SCALE &amp; ITERATE</text>

    <rect x="920" y="206" width="340" height="470" rx="6" fill="#f4f6f8" stroke="#d8dee4"/>

    <text x="938" y="234" font-size="13.5" font-weight="bold" fill="#1f2d3d">Goal</text>
    <text x="938" y="254" font-size="12.5" fill="#3d4753">Expand the model across accounts;</text>
    <text x="938" y="270" font-size="12.5" fill="#3d4753">refine based on system-wide</text>
    <text x="938" y="286" font-size="12.5" fill="#3d4753">implementation learning.</text>

    <text x="938" y="318" font-size="13.5" font-weight="bold" fill="#1f2d3d">Key Moves</text>
    <text x="938" y="338" font-size="12" fill="#3d4753">• Working-group reviews continue,</text>
    <text x="938" y="353" font-size="12" fill="#3d4753">  now informed by cross-account</text>
    <text x="938" y="368" font-size="12" fill="#3d4753">  patterns</text>
    <text x="938" y="386" font-size="12" fill="#3d4753">• Identify which behaviors predict</text>
    <text x="938" y="401" font-size="12" fill="#3d4753">  sustained implementation</text>
    <text x="938" y="419" font-size="12" fill="#3d4753">• Identify which adaptations move</text>
    <text x="938" y="434" font-size="12" fill="#3d4753">  teacher intent most</text>

    <text x="938" y="466" font-size="13.5" font-weight="bold" fill="#1f2d3d">Beyond This Roadmap</text>
    <text x="938" y="486" font-size="12" fill="#3d4753">• Greater content modularity by</text>
    <text x="938" y="501" font-size="12" fill="#3d4753">  session length, focus, sequence</text>
    <text x="938" y="519" font-size="12" fill="#3d4753">• District-level views of the same</text>
    <text x="938" y="534" font-size="12" fill="#3d4753">  data for renewal decisions</text>

    <rect x="938" y="592" width="304" height="70" rx="5" fill="#eef4ee" stroke="#5a8a5f"/>
    <text x="950" y="611" font-size="12.5" font-weight="bold" fill="#2f5c34">Guiding principle:</text>
    <text x="950" y="628" font-size="11.5" fill="#2f5c34">Scaling before proof risks embedding</text>
    <text x="950" y="643" font-size="11.5" fill="#2f5c34">a tool that doesn't work at broader</text>
    <text x="950" y="656" font-size="11.5" fill="#2f5c34">cost — expansion follows evidence</text>
  </g>

  <!-- Bottom sequencing note -->
  <rect x="40" y="700" width="1220" height="60" rx="8" fill="#f7f3e8" stroke="#b28a2f"/>
  <text x="650" y="726" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6d1f">This is a learning cycle, not a fixed plan</text>
  <text x="650" y="746" text-anchor="middle" font-size="12" fill="#8a6d1f">Each phase tests assumptions, generates evidence, and determines what the next phase should be — small, low-cost experiments run continuously throughout</text>

  <!-- Footer -->
  <text x="650" y="800" text-anchor="middle" font-size="13" fill="#8a94a1">Source: Section 10, Roadmap and Implementation Sequencing — i-Ready Classroom Mathematics Professional Learning teardown</text>
</svg>
